# =============================================================================
# Portable-комплект gpu-infer-kit: полная сборка и публикация ассетом релиза.
# =============================================================================
# Отличие от kit-build.yml (сборка по требованию) здесь принципиальное:
#   - собираются ОБА движка одним прогоном (-Engines "strata;llama"), потому что только
#     такой прогон пишет объединённые build-measure.json / elf-proof.json. Парный прогон
#     по движкам дал бы *.partial.json, а pack_kit.ps1 читает именно объединённые меры и
#     при их отсутствии обязан отказать, а не упаковать половину доказательства;
#   - архитектуры полные (86;89;120) - комплект рассчитан на разные карты, и -Arch здесь
#     меняет содержимое архива, а не только ширину codegen;
#   - zip проходит формат-гейт по байтам (verify_zip.sh) ДО публикации: под bash голый tar
#     пишет POSIX-tar с кодом выхода 0, GitHub по расширению ставит application/zip, и
#     мёртвый архив доезжает до пользователя;
#   - распакованный zip прогоняется ЖИВЫМ движком (smoke_kit.ps1) ДО публикации: формат-гейт и
#     гейты состава меряют байты и имена, а комплектный llama-server.exe умирал с 0xC0000005
#     в первые ~50 мс, уже на «initializing ...» - то есть архив был целым, а движок в нём
#     мёртвым (замеры kit374/kit375/kit379/kit380/kit390 в E:\tmp\);
#   - маркеры наших патчей сверяются по байтам обоих движков (Strata и llama.cpp): зелёная
#     сборка сама по себе ничего не доказывает.
# Версия комплекта: если запуск был по релизу, pack_kit.ps1 получает -Version = тег без
# префикса "kit-", и имя архива строится из этой же версии (одна точка истины); при
# workflow_dispatch без тега упаковщик берёт дату started из build-measure.json, а шаг
# публикации не выполняется.
# Ассет загружается в УЖЕ СОЗДАННЫЙ релиз: gh release upload не создаёт релиз молча.
name: "Kit release (portable gpu-infer-kit)"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Тег существующего релиза для загрузки ассета (пусто = только сборка и артефакт)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: kit-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CUDA_VERSION: '13.3.1'
  # Русские строки python-гейтов идут в лог шага. Без этих переменных python выбирает кодовую
  # страницу консоли - замер 12.11 на стенде даёт sys.stdout.encoding=cp1251, и строка
  # «приёмка комплекта» уходит 19 байтами cp1251 вместо 35 байт UTF-8. Код возврата при этом 0,
  # то есть прогон зелёный, а приёмка в логе Actions читается как mojibake.
  PYTHONIOENCODING: 'utf-8'
  PYTHONUTF8: '1'
  ARCH: '86;89;120'
  GGML_REPO: 'bahooo22/llama.cpp'
  # SHA в ref-аргументе checkout обязан быть полной длины: 40 или 64 символа, иначе actions/checkout
  # трактует его как имя ref и fetch падает с rc=128. Развёрнуто - комментарий в kit-build.yml.
  GGML_PIN: '3cf03257f219afbe7334045ff7c6a06ac68c627d'
  LLAMA_REPO: 'bahooo22/llama.cpp'
  LLAMA_REF: 'kit-all-sync'
  KIT_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
  # Крошечная GGUF для живой приёмки движка - НЕ выдуманная: тот же вход, что берёт CI llama.cpp
  # для тестов самого llama-server (первичник форка: llama-master/tools/server/tests/utils.py:55-56
  # model_hf_repo='ggml-org/models', model_hf_file='tinyllamas/stories260K.gguf'; там же
  # tools/server/tests/README.md:79 и .github/workflows/build-ibm.yml:103 для соседа -be).
  # Доступность мерилась живым HEAD 14.11: 307 -> 302 -> 200, X-Linked-Size и content-length =
  # 1 185 376 Б (тот же размер, что у стендового E:\tmp\stories260K.gguf в замерах kit375/380/390).
  # 1.2 МиБ вместо гигабайт: веб-морда llama.cpp встроена в llama-server-impl.dll и не зависит от
  # весов, а мёртвый kit (kit375) падает на этой модели ровно так же, как на 15 ГиБ.
  TINY_GGUF_URL: 'https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf'
  TINY_GGUF_BYTES: '1185376'

jobs:
  kit:
    name: Сборка двух движков, упаковка и публикация
    runs-on: windows-2022
    # Обоснование лимита - прогоны с нуля того же состава на стенде, archs = 86;89;120. Носители
    # чисел лежат в dist\ каждого снимка, а состав доказан CMakeCache.txt деревьев сборки и fatbin
    # бинарников (поле archs в этих measure пустое - они сняты прежним кодом): strata 1686.2 с
    # (160 компиляций и 14 линковок из плана 174, 174/174 рёбер лога, commit 0f37b86e) и повтор
    # 1774.1 с; llama 3006.1 с (commit c8b1899f9) и 3321.0 с, оба на 330/330 рёбер и 315 компиляций.
    # Худшая из пар - 1774.1 + 3321.0 = 5095.1 с = 84.9 мин, пара одного прогона - 4692.3 с: у 240
    # минут запас 2.8 к худшей паре, остальное уходит на тулчейн CUDA, упаковку и публикацию ассета.
    # Прежнее обоснование (712.6 с + 2788.8 с) снято с прогревов - 25+5 и 156+8 выполненных шагов
    # вместо 174 и 330, то есть цена полной компиляции была недооценена в 2-4 раза.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { path: strata }

      - name: "Форк llama.cpp: его серверы входят в комплект (наши патчи)"
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_REPO }}
          ref: ${{ env.LLAMA_REF }}
          path: llama
          fetch-depth: 1
          persist-credentials: false

      - name: "ggml-пин Страты: K-quant template-instances (q2_k)"
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GGML_REPO }}
          ref: ${{ env.GGML_PIN }}
          path: ggml-pin
          fetch-depth: 1
          persist-credentials: false

      - name: Контроль входных файлов до компиляции
        shell: bash
        run: |
          for f in strata/packaging/kit/ci/build_kit.ps1 \
                   strata/packaging/kit/ci/pack_kit.ps1 \
                   strata/packaging/kit/ci/smoke_kit.ps1 \
                   strata/packaging/kit/ci/kit_dll_deps.py \
                   strata/packaging/kit/ci/patch_markers.py \
                   strata/packaging/kit/ci/verify_zip.sh \
                   strata/packaging/kit/START.bat \
                   ggml-pin/ggml/src/ggml-cuda/mma.cuh \
                   llama/CMakeLists.txt; do
            if [ ! -f "$f" ]; then echo "::error::нет $f - сборка не начата"; exit 2; fi
          done
          echo "проверено 9 файлов комплекта"

      - name: "Проверка переносимости текстов комплекта (дешёвая, до компиляции)"
        shell: pwsh
        run: |
          # Репетиция 43359812438 упала на шаге упаковки из-за пути стенда в README - после 5454 с
          # компиляции. Тот же гейт №2 живёт в pack_kit.ps1, здесь он вызван раньше и по исходникам:
          # перечень файлов берётся из манифеста, второй копии списка нет.
          & pwsh -NoProfile -NonInteractive -File "strata\packaging\kit\ci\pack_kit.ps1" `
              -TextGate -KitSrc "strata\packaging\kit" -RepoSrc "strata"
          Write-Host "rc(pack_kit -TextGate)=$LASTEXITCODE"
          exit $LASTEXITCODE

      - name: "Релиз под ассет существует (дешёвый гейт до компиляции)"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh берёт репозиторий из git remote текущей директории, а в $GITHUB_WORKSPACE remote
          # нет: все три checkout кладут дерево в подкаталоги (path: strata, llama, ggml-pin).
          # Без GH_REPO любой вызов gh падает с «no repository detected», и в прежнем коде это
          # выглядело как «релиза нет», потому что stderr был съеден >/dev/null 2>&1.
          # Замер 13.11, прогон события release 43415264688: REST по тегу kit-2026-11-13 = 200,
          # а гейт красный за 49 с - то есть отсутствовал не релиз, а репозиторий для gh.
          GH_REPO: ${{ github.repository }}
        run: |
          # Тот же класс, что и с GH_TOKEN: gh release upload не создаёт релиз молча, а без
          # этого гейта отказ приходил на последний шаг, то есть после двухчасовой сборки.
          if [ -z "${KIT_TAG:-}" ]; then
            echo "тега нет: прогон только собирает и оставляет артефакт - публикация не требуется"
            exit 0
          fi
          # Сообщение gh печатается вместе с кодом возврата: «релиза нет», «нет прав» и
          # «gh не нашёл репозиторий» лечатся по-разному, и различать их обязан лог шага.
          gh release view "$KIT_TAG" >/dev/null 2>/tmp/gh-view.err && rc=0 || rc=$?
          if [ "$rc" = 0 ]; then
            echo "релиз $KIT_TAG найден: ассет доедет в него"
            exit 0
          fi
          echo "rc(gh release view)=$rc: $(cat /tmp/gh-view.err)"
          echo "::error::релиз $KIT_TAG недоступен gh (rc=$rc) - компиляция не начиналась,"
          echo "минуты сборки не потрачены; текст ошибки выше."
          exit 1

      - name: Кэш redist-архивов CUDA
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\cuda-dl
          key: cuda-dl-${{ env.CUDA_VERSION }}-kit

      - name: Тулчейн CUDA из redist-архивов
        shell: pwsh
        run: |
          $ci = Join-Path $env:GITHUB_WORKSPACE 'strata\packaging\kit\ci'
          & pwsh -NoProfile -NonInteractive -File $ci\install_cuda_redist.ps1 `
              -Root (Join-Path $env:RUNNER_TEMP 'cuda') `
              -CacheDir (Join-Path $env:RUNNER_TEMP 'cuda-dl') `
              -CudaVersion $env:CUDA_VERSION
          Write-Host "rc(install_cuda_redist)=$LASTEXITCODE"
          exit $LASTEXITCODE

      - name: Сборка обоих движков под CUDA (полный набор архитектур)
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $ci = Join-Path $ws 'strata\packaging\kit\ci'
          & pwsh -NoProfile -NonInteractive -File $ci\build_kit.ps1 `
              -StrataSrc (Join-Path $ws 'strata') `
              -LlamaSrc (Join-Path $ws 'llama') `
              -GgmlDir (Join-Path $ws 'ggml-pin') `
              -Cuda (Join-Path $env:RUNNER_TEMP 'cuda') `
              -Out (Join-Path $env:RUNNER_TEMP 'kit') `
              -Engines 'strata;llama' -Arch $env:ARCH -SkipProbe
          Write-Host "rc(build_kit)=$LASTEXITCODE"
          exit $LASTEXITCODE

      - name: "Гейт маркеров: наши патчи в собранных exe и dll"
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $pm = Join-Path $ws 'strata\packaging\kit\ci\patch_markers.py'
          $bad = @()
          python $pm --engine strata `
              --bin (Join-Path $ws 'strata\build-kit\strata-q36.exe') `
              --bin (Join-Path $ws 'strata\build-kit\strata.exe') `
              --out (Join-Path $env:RUNNER_TEMP 'kit\markers-strata.json')
          Write-Host "rc(patch_markers strata)=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { $bad += 'strata' }
          python $pm --engine llama `
              --bin (Join-Path $ws 'llama\build-kit\bin\ggml-base.dll') `
              --bin (Join-Path $ws 'llama\build-kit\bin\ggml-cuda.dll') `
              --bin (Join-Path $ws 'llama\build-kit\bin\llama.dll') `
              --out (Join-Path $env:RUNNER_TEMP 'kit\markers-llama.json')
          Write-Host "rc(patch_markers llama)=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { $bad += 'llama' }
          if ($bad) { Write-Host "::error::маркеры потеряны в: $($bad -join ', ')"; exit 1 }

      - name: Реестр нативных зависимостей бинарников
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -find '**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { Write-Host 'ОТКАЗ: dumpbin.exe не найден через vswhere - проверка не состоялась'; exit 2 }
          $bins = @('strata\build-kit\strata-q36.exe', 'strata\build-kit\strata.exe',
                    'strata\build-kit\strata_kq.dll',
                    'llama\build-kit\bin\llama-server.exe', 'llama\build-kit\bin\ggml-cuda.dll',
                    'llama\build-kit\bin\ggml-base.dll', 'llama\build-kit\bin\llama.dll')
          # strata_kq.dll в этом списке не потому, что у неё трудные зависимости (импортов у неё
          # ровно один - KERNEL32: CUDA-рантайм линкован статически, cmake/backends/cuda.cmake),
          # а потому, что она грузится из кода по имени и без неё комплект деградирует молча.
          $a = @('strata\packaging\kit\ci\kit_dll_deps.py')
          foreach ($b in $bins) { $a += @('--bin', (Join-Path $ws $b)) }
          $a += @('--dumpbin', $dumpbin,
                  '--cuda-bin', (Join-Path $env:RUNNER_TEMP 'cuda\bin'),
                  '--extra-dir', (Join-Path $ws 'llama\build-kit\bin'),
                  '--out', (Join-Path $env:RUNNER_TEMP 'kit\runtime-deps.json'))
          python @a
          Write-Host "rc(kit_dll_deps)=$LASTEXITCODE"
          exit $LASTEXITCODE

      - name: Раскладка и упаковка комплекта
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $ci = Join-Path $ws 'strata\packaging\kit\ci'
          $a = @('-StrataBuild', (Join-Path $ws 'strata\build-kit'),
                 '-LlamaBuild', (Join-Path $ws 'llama\build-kit'),
                 '-Measures', (Join-Path $env:RUNNER_TEMP 'kit'),
                 '-Stage', (Join-Path $env:RUNNER_TEMP 'stage\gpu-infer-kit'),
                 '-CudaBin', (Join-Path $env:RUNNER_TEMP 'cuda\bin'))
          # Имя архива строится как "gpu-infer-kit-<версия>.zip", а тег релиза называется
          # "kit-<дата>": передан как есть, он даёт "gpu-infer-kit-kit-<дата>.zip" - двойной
          # префикс в имени файла, которое пользователь показывает по ссылке. Шагам 7 и 16 нужен
          # точный тег, поэтому префикс снимается только здесь и только для -Version.
          if ($env:KIT_TAG) {
              $v = $env:KIT_TAG -replace '^kit-', ''
              Write-Host "тег $env:KIT_TAG -> версия комплекта $v"
              $a += @('-Version', $v)
          }
          & pwsh -NoProfile -NonInteractive -File $ci\pack_kit.ps1 @a
          Write-Host "rc(pack_kit)=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Класс «сборка произвела, а прогон не показал»: kit-weight.json пишется в каталог мер,
          # а в списке артефакта прогона 43388763285 значился путь из каталога раскладки. Файл не
          # доехал молча, потому что if-no-files-found стоит в warn. Теперь отсутствие любой меры
          # красит шаг упаковки, а не теряется в логе загрузки артефакта.
          $mdirs = Join-Path $env:RUNNER_TEMP 'kit'
          $need = @("build-measure.json", "elf-proof.json", "runtime-deps.json", "kit-weight.json")
          $miss = @($need | Where-Object { -not (Test-Path -LiteralPath (Join-Path $mdirs $_)) })
          if ($miss.Count) {
              Write-Host ("ОТКАЗ: после rc=0 нет мер " + ($miss -join ", ") + " - проверка не состоялась")
              exit 2
          }
          Write-Host "меры упаковки на месте: 4 файла"
          exit 0

      - name: "Формат-гейт архива по байтам (заголовок PK, EOCD, обязательные записи)"
        shell: bash
        run: |
          files=( "$RUNNER_TEMP"/gpu-infer-kit-*.zip )
          if [ ! -f "${files[0]}" ]; then
            echo "::error::архив не найден в $RUNNER_TEMP - проверка не состоялась"; exit 2
          fi
          if [ "${#files[@]}" -gt 1 ]; then
            echo "::error::архивов несколько (${#files[@]}) - неясно, какой публиковать"; exit 2
          fi
          # Тот же класс, что и шаг публикации: под `bash -eo pipefail` rc!=0 у verify_zip роняет
          # шаг до строки с цифрой, и в красном логе не остаётся ни rc, ни KIT_ZIP.
          bash strata/packaging/kit/ci/verify_zip.sh "${files[0]}" && rc=0 || rc=$?
          echo "rc(verify_zip)=$rc"
          [ "$rc" = 0 ] || exit "$rc"
          echo "KIT_ZIP=${files[0]}" >> "$GITHUB_ENV"

      - name: "Живая приёмка распакованного комплекта: движок обязан подняться"
        shell: pwsh
        run: |
          # Гейт, которого не было: архив собирается, гейты состава и формат-гейт зелёные - и
          # мёртвый бинарник доезжает до релиза. Замеры 13-14.11 (E:\tmp\kit374-watch.verdict.txt,
          # kit375-localize.verdict.txt, kit379-forensics.verdict.txt, kit380-split.verdict.txt,
          # kit390-cuda-env.verdict.txt): комплектный llama-server.exe (10 752 Б, stub рядом с
          # llama-server-impl.dll 7 632 896 Б) падает с 0xC0000005 в первые ~50 мс, stderr обрывается
          # на «srv  llama_server: initializing ...», то есть ДО загрузки модели; CUDA-бэкенд ни при чём.
          # Ни одна прежняя проверка этого не ловит, потому что ничего не запускалась: мерить надо
          # процесс и HTTP-ответ, а не наличие файла и не размер zip.
          #
          # Меряется РАСПАКОВАННЫЙ бандл - ровно то, что получит пользователь, а не дерево сборки:
          # дефект живёт между сборкой и носителем (kit379: dll в dist побайтово равны сборке).
          # Проверка осмысленна на CPU: у windows-раннера дискретного GPU нет, поэтому llama-нога
          # идёт с -ngl 0 (мёртвый kit краснеет и на CPU - kit380/kit390), а Страта-нога снимает
          # морду с сервера kit\serve\server.py; движок Страты на безгитарном раннере подниматься
          # не обязан, и smoke_kit.ps1 печатает это ОТДЕЛЬНЫМ исходом, а не пропуском.
          $ErrorActionPreference = 'Stop'
          $zip = ${env:KIT_ZIP}
          if (-not $zip -or -not (Test-Path -LiteralPath $zip)) {
              Write-Host "::error::нет архива '$zip' - живой прогон не состоялся (шаг формат-гейта не назвал KIT_ZIP)"
              exit 2
          }
          $un = Join-Path $env:RUNNER_TEMP ('smoke-unpack-' + [System.IO.Path]::GetRandomFileName().Replace('.', ''))
          New-Item -ItemType Directory -Path $un -Force | Out-Null
          # Именно Expand-Archive, а не выборочная распаковка: пользователь достает архив целиком,
          # и «распаковывается ли он вообще» - часть того же класса дефектов (verify_zip меряет
          # байты заголовка, а не читаемость дерева).
          $t0 = Get-Date
          Expand-Archive -LiteralPath $zip -DestinationPath $un
          $items = @(Get-ChildItem -LiteralPath $un -Recurse -File -ErrorAction SilentlyContinue)
          $bytes = 0L
          foreach ($i in $items) { $bytes += $i.Length }
          Write-Host ("распаковано: {0} файлов, {1:N0} Б за {2:N0} с - корень: $un" -f $items.Count, $bytes, ((Get-Date) - $t0).TotalSeconds)
          if ($items.Count -lt 20) {
              Write-Host "::error::распаковка дала только $($items.Count) файлов - комплекту нечем подниматься"
              exit 1
          }

          $gguf = Join-Path $env:RUNNER_TEMP 'stories260K.gguf'
          if (-not (Test-Path -LiteralPath $gguf)) {
              $t1 = Get-Date
              Invoke-WebRequest -Uri $env:TINY_GGUF_URL -OutFile $gguf -UseBasicParsing -TimeoutSec 300
              Write-Host ("модель скачана: {0} Б за {1:N0} с ({2})" -f (Get-Item $gguf).Length, ((Get-Date) - $t1).TotalSeconds, $env:TINY_GGUF_URL)
          } else {
              Write-Host "модель уже в раннере: $gguf"
          }
          $sz = (Get-Item $gguf).Length
          Write-Host "размер модели: $sz Б (ожидалось $($env:TINY_GGUF_BYTES) по живому HEAD 14.11)"

          $sk = Join-Path $env:GITHUB_WORKSPACE 'strata\packaging\kit\ci\smoke_kit.ps1'
          if (-not (Test-Path -LiteralPath $sk)) { Write-Host "::error::нет $sk - приёмка не состоялась"; exit 2 }
          & pwsh -NoProfile -NonInteractive -File $sk -KitDir $un -Model $gguf -Strata auto -WaitSec 240 -PortStart 18100
          # Код возврата снимается отдельно и ПЕЧАТАЕТСЯ: rc=0/1/2 у этого гейта означают
          # «зелёное» / «находка» / «прогон не состоялся», и красный лог обязан различать их.
          $rc = $LASTEXITCODE
          Write-Host "rc(smoke_kit)=$rc"
          if ($rc -eq 0) { Write-Host 'комплект живой: движок поднялся, /props и страница отдаются' }
          if ($rc -eq 1) { Write-Host '::error::движок из распакованного комплекта не поднялся или не отдал страницу - публикация запрещена' }
          if ($rc -eq 2) { Write-Host '::error::живая приёмка не состоялась (плохие входы): публиковать не проверено' }
          # Временное дерево (до ~1.3 ГиБ) убирается за собой даже при красном rc: следующий шаг
          # грузит меры и архив, и место на системном диске раннера не бесконечно.
          Remove-Item -LiteralPath $un -Recurse -Force -ErrorAction SilentlyContinue
          exit $rc

      - name: Меры, логи и архив как артефакт прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kit-release-${{ github.run_number }}
          # kit-weight.json - по пути МЕРЫ (runner.temp\kit), а не раскладки: pack_kit.ps1 пишет
          # его в -Measures. Прежняя строка со stage\gpu-infer-kit никогда не совпадала с файлом,
          # а if-no-files-found: warn оставлял прогон зелёным без замера веса.
          # Внутри блок-скаляра path: | строка с # - это не комментарий, а литеральный путь,
          # поэтому объяснение стоит НАД path, а список ниже содержит только файлы.
          path: |
            ${{ env.KIT_ZIP }}
            ${{ runner.temp }}\kit\build-measure.json
            ${{ runner.temp }}\kit\elf-proof.json
            ${{ runner.temp }}\kit\runtime-deps.json
            ${{ runner.temp }}\kit\markers-strata.json
            ${{ runner.temp }}\kit\markers-llama.json
            ${{ runner.temp }}\kit\build-strata.log
            ${{ runner.temp }}\kit\build-llama.log
            ${{ runner.temp }}\kit\kit-weight.json
          retention-days: 30
          if-no-files-found: warn

      - name: Публикация ассетом релиза
        shell: bash
        env:
          # gh НЕ наследует автоматический токен прогона: без этой строки шаг падает с
          # «gh: To use GitHub CLI in a GitHub Actions workflow, set the GH_TOKEN environment
          # variable» - и падает последним, то есть после полной двухчасовой сборки.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Причина та же, что в дешёвом гейте перед компиляцией: в $GITHUB_WORKSPACE нет git
          # remote (checkout идут в подкаталоги), поэтому gh обязан получить GH_REPO.
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "${KIT_TAG:-}" ]; then
            echo "Тег релиза не задан: сборка проверена, ассет не публикуется"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN пуст - публикация не состоялась (не путать с «патчей нет»)"
            exit 2
          fi
          if [ ! -f "${KIT_ZIP:-}" ]; then
            echo "::error::нет архива ${KIT_ZIP} - публиковать нечего"; exit 2
          fi
          gh release view "$KIT_TAG" >/dev/null 2>/tmp/gh-view2.err && rc=0 || rc=$?
          if [ "$rc" != 0 ]; then
            echo "rc(gh release view)=$rc: $(cat /tmp/gh-view2.err)"
            echo "::error::релиз $KIT_TAG недоступен gh - ассет загружается только в существующий релиз"
            exit 1
          fi
          # gh с rc!=0 под `bash -eo pipefail` (дефолт shell: bash) роняет шаг ДО строки с rc, и
          # цифра публикации теряется ровно в том случае, когда она нужнее всего.
          gh release upload "$KIT_TAG" "$KIT_ZIP" --clobber && rc=0 || rc=$?
          echo "rc(gh release upload)=$rc - тег $KIT_TAG, архив $(basename "$KIT_ZIP")"
          [ "$rc" = 0 ] || exit "$rc"
          # Ссылка на ассет прямо в логе прогона: это и есть то, что получает пользователь,
          # и заодно доказательство, что загрузился именно архив комплекта, а не мера.
          gh release view "$KIT_TAG" --json assets \
            --jq '.assets[] | "ассет \(.name) \(.sizeBytes) Б \(.url)"' && rc=0 || rc=$?
          echo "rc(gh release view --json assets)=$rc"
          exit "$rc"
